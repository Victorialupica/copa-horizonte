<body>

  <header class="navbar">
    <div class="navbar__brand">
      <img src="assets/logo-escudo-transparente.png" alt="Escudo Copa Horizonte" class="navbar__logo" />
      <span class="navbar__title">COPA <strong>HORIZONTE</strong></span>

    <button class="navbar__toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="navbar__menu" id="navMenu">
      <a href="index.html">Inicio</a>
      <a href="cronograma.html">Cronograma</a>

    </div>

    <i class="fa-solid fa-trophy page-header__icon"></i>

  <section class="filters">
    <div class="filters__group" id="categoryFilters">
      <button class="filter-chip filter-chip--active" data-category="Sub 14">Sub 14</button>

  <table class="standings-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Equipo</th>
        <th>PJ</th>
        <th>G</th>
        <th>E</th>
        <th>P</th>
        <th>GF</th>
        <th>GC</th>
        <th>DG</th>
        <th>PTS</th>
      </tr>
    </thead>
